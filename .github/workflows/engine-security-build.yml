name: Security engine build

on:
  # PRs rebuild and hash-check the same engine as part of Windows tests.
  # This standalone workflow is for an explicit reproducibility check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Patched stable Windows amd64 engine
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build from verified source and toolchain
        run: ./scripts/Build-SecurityEngine.ps1

      - name: Save engine and corresponding source evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/security-engine-build-*/artifacts/*
          if-no-files-found: error
          retention-days: 30
