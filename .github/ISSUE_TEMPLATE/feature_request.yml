name: Feature request
description: Describe a concrete usage need and the expected behavior.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        The project uses your existing official Discord Stable and its profile; it does not change system-wide network settings.
        Do not share tokens, profiles, journal.json recovery files, raw logs, personal paths/IP addresses or signed download URLs. For security findings, use the [SECURITY.md](https://github.com/alpertknn/DiscordAccess/blob/main/SECURITY.md) policy.
  - type: textarea
    id: need
    attributes:
      label: Usage need to solve
      description: Use a synthetic example to describe during which operation the problem occurs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the result the user would see and its effect on the current flow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current approach or alternative
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not use sensitive or personal data in the example.
          required: true
